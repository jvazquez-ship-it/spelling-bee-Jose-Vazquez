          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = 'sine';
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * 0.22);
          gain.gain.exponentialRampToValueAtTime(0.035, now + index * 0.22 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.22 + 0.18);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now + index * 0.22);
          oscillator.stop(now + index * 0.22 + 0.2);
        });
        musicTimer = setTimeout(playMusicLoop, 1100);
      } catch (error) {}
    }
    function playFeedbackSound(type) {
      if (gameState.muted) return;
      try {
        audioContext = audioContext || new (window.AudioContext || window.webkitAudioContext)();
        const now = audioContext.currentTime;
        const notes = type === 'success' ? [523.25, 659.25, 783.99] : [220, 174.61];
        notes.forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          oscillator.type = type === 'success' ? 'sine' : 'triangle';
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * 0.11);
          gain.gain.exponentialRampToValueAtTime(0.16, now + index * 0.11 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.11 + 0.2);
          oscillator.connect(gain);
          gain.connect(audioContext.destination);
          oscillator.start(now + index * 0.11);
          oscillator.stop(now + index * 0.11 + 0.22);
        });
      } catch (error) {}
    }

    function speak(text, rate = 0.62) {
      return new Promise((resolve) => {
        if (gameState.muted) { resolve(); return; }
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(text);
          const voices = window.speechSynthesis.getVoices();
          const englishVoice = voices.find(voice => /^en-(US|GB|AU|CA)\b/i.test(voice.lang) && /Samantha|Karen|Daniel|Google|Microsoft|Natural|Premium/i.test(voice.name))
            || voices.find(voice => /^en-(US|GB|AU|CA)\b/i.test(voice.lang))
            || voices.find(voice => /^en\b/i.test(voice.lang));
          utterance.voice = englishVoice || null;
          utterance.lang = englishVoice?.lang || 'en-US';
          utterance.rate = rate;
          utterance.pitch = 1;
          utterance.volume = 1;
          utterance.onend = resolve;
          utterance.onerror = resolve;
          window.speechSynthesis.speak(utterance);
        } else {
          resolve();
        }
      });
    }

    function pronounceWord() {
      if (gameState.currentWord) speak(gameState.currentWord.word, 0.58);
    }

    async function spellWord() {
      if (!gameState.currentWord) return;
      const word = gameState.currentWord.word;
      const display = document.getElementById('spelling-display');
      display.innerHTML = '';
      await speak(word, 0.58);
      await new Promise(r => setTimeout(r, 500));
      for (let i = 0; i < word.length; i++) {
        const ch = word[i];
        const tile = document.createElement('span');
        if (ch === ' ') {
          tile.className = 'letter-tile space-tile bounce-in';
        } else {
          tile.className = 'letter-tile bg-amber-400 text-amber-900 bounce-in';
          tile.textContent = ch.toUpperCase();
          await speak(ch, 0.52);
        }
        display.appendChild(tile);
        await new Promise(r => setTimeout(r, 300));
      }
      setTimeout(() => { display.innerHTML = ''; }, 3000);
    }

    function giveHint() {
      if (!gameState.currentWord) return;
      const word = gameState.currentWord.word;
      const feedback = document.getElementById('feedback');
      feedback.className = 'text-center mb-6 text-xl font-bold text-pink-500';
      feedback.innerHTML = `💡 It starts with "<span class="text-amber-700">${word[0].toUpperCase()}</span>" and has ${word.replace(/ /g,'').length} letters`;
    }

    function selectDifficulty(difficulty) {
      gameState.currentDifficulty = difficulty;
      document.getElementById('difficulty-selection').classList.add('hidden');
      document.getElementById('game-content').classList.remove('hidden');
      getNewWord(difficulty);
    }

    function getRandomWord(difficulty) {
      const wordList = words[difficulty];
      const used = gameState.usedWords[difficulty];
      let availableWords = wordList.filter(w => !used.includes(w.word));
      if (availableWords.length === 0) {
        gameState.usedWords[difficulty] = [];
        availableWords = wordList;
      }
      const wordObj = availableWords[Math.floor(Math.random() * availableWords.length)];
      gameState.usedWords[difficulty].push(wordObj.word);
      return { ...wordObj, difficulty };
    }

    function getNewWord(difficulty) {
      const wordData = getRandomWord(difficulty);
      gameState.currentWord = wordData;
      gameState.currentDifficulty = wordData.difficulty;
      gameState.wordPronounced = false;

      document.getElementById('definition').textContent = wordData.definition;
      document.getElementById('word-image').textContent = wordData.emoji;
      const input = document.getElementById('answer-input');
      input.value = '';
      document.getElementById('feedback').textContent = '';
      document.getElementById('spelling-display').innerHTML = '';

      const badge = document.getElementById('difficulty-badge');
      badge.className = 'px-4 py-2 rounded-full text-white font-bold text-sm ';
      if (wordData.difficulty === 'easy') { badge.className += 'difficulty-easy'; badge.innerHTML = '⭐ Easy (+1 point)'; }
      else if (wordData.difficulty === 'medium') { badge.className += 'difficulty-medium'; badge.innerHTML = '⭐⭐ Medium (+2 points)'; }
      else { badge.className += 'difficulty-hard'; badge.innerHTML = '⭐⭐⭐ Hard (+3 points)'; }

      setTimeout(() => { pronounceWord(); input.focus(); }, 500);
    }

    document.getElementById('answer-input').addEventListener('input', function(e) {
      if (e.target.value.length === 1 && !gameState.wordPronounced && gameState.currentWord) {
        gameState.wordPronounced = true;
        pronounceWord();
      }
    });

    function updateStreakDisplay() {
      const el = document.getElementById('streak-display');
      const count = document.getElementById('streak-count');
      if (gameState.streak >= 2) {
        el.classList.remove('hidden');
        count.textContent = gameState.streak;
      } else {
        el.classList.add('hidden');
      }
    }

    function checkAnswer() {
      if (!gameState.currentWord) return;
      const input = document.getElementById('answer-input');
      const answer = input.value.trim().toLowerCase().replace(/\s+/g, ' ');
      const correct = gameState.currentWord.word.toLowerCase().replace(/\s+/g, ' ');
      const feedback = document.getElementById('feedback');

      if (answer === correct) {
        playFeedbackSound('success');
        gameState.streak++;
        let points = gameState.currentDifficulty === 'easy' ? 1 : gameState.currentDifficulty === 'medium' ? 2 : 3;
        let bonusMsg = '';
        if (gameState.streak > 0 && gameState.streak % 3 === 0) {
          points += 1;
          bonusMsg = ' 🔥 +1 streak bonus!';
        }
        feedback.className = 'text-center mb-6 text-xl font-bold text-green-500 bounce-in';
        feedback.innerHTML = `✅ Correct! Well done!${bonusMsg}`;

        if (gameState.currentPlayer === 1) {
          gameState.player1Score += points;
          document.getElementById('player1-score').textContent = gameState.player1Score;
        } else {
          gameState.player2Score += points;
          document.getElementById('player2-score').textContent = gameState.player2Score;
        }
        updateStreakDisplay();
        setTimeout(() => nextTurn(), 1500);
      } else {
        playFeedbackSound('error');
        gameState.streak = 0;
        updateStreakDisplay();
        feedback.className = 'text-center mb-6 text-xl font-bold text-red-500 shake';
        feedback.innerHTML = `❌ Incorrect! The word was: <span class="text-amber-600">${gameState.currentWord.word.toUpperCase()}</span>`;
        input.classList.add('shake');
        setTimeout(() => input.classList.remove('shake'), 500);
        setTimeout(() => nextTurn(), 2000);
      }
    }

    function skipWord() {
      if (!gameState.currentWord) return;
      playFeedbackSound('error');
      gameState.streak = 0;
      updateStreakDisplay();
      const feedback = document.getElementById('feedback');
      feedback.className = 'text-center mb-6 text-xl font-bold text-gray-500';
      feedback.innerHTML = `⏭️ Skipped! The word was: <span class="text-amber-600">${gameState.currentWord.word.toUpperCase()}</span>`;
      setTimeout(() => nextTurn(), 1500);
    }

    function updateProgressBar() {
      const pct = Math.min(100, Math.round((gameState.currentRound / gameState.totalRounds) * 100));
      document.getElementById('progress-fill').style.width = pct + '%';
    }

    function nextTurn() {
      gameState.currentPlayer = gameState.currentPlayer === 1 ? 2 : 1;
      document.getElementById('current-player-turn').textContent = gameState.currentPlayer === 1 ? gameState.player1Name : gameState.player2Name;

      const p1Card = document.getElementById('player1-card');
      const p2Card = document.getElementById('player2-card');
      if (gameState.currentPlayer === 1) {
        p1Card.classList.add('player-active', 'pulse-glow');
        p2Card.classList.remove('player-active', 'pulse-glow');
      } else {
        p2Card.classList.add('player-active', 'pulse-glow');
        p1Card.classList.remove('player-active', 'pulse-glow');
      }

      if (gameState.currentPlayer === 1) {
        gameState.currentRound++;
        document.getElementById('round-display').textContent = `${gameState.currentRound}/20`;
        updateProgressBar();
        if (gameState.currentRound > gameState.totalRounds) { endGame(); return; }
      }

      document.getElementById('game-content').classList.add('hidden');
      document.getElementById('difficulty-selection').classList.remove('hidden');
      document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('selected'));
    }

    function showResetConfirm() { document.getElementById('reset-confirm').classList.add('active'); }
    function confirmReset() { document.getElementById('reset-confirm').classList.remove('active'); goToStart(); }
    function cancelReset() { document.getElementById('reset-confirm').classList.remove('active'); }

    function startGame() {
      gameState.player1Name = document.getElementById('player1-name').value.trim() || 'Player 1';
      gameState.player2Name = document.getElementById('player2-name').value.trim() || 'Player 2';
      document.getElementById('player1-name-display').textContent = gameState.player1Name;
      document.getElementById('player2-name-display').textContent = gameState.player2Name;
      document.getElementById('final-p1-name').textContent = gameState.player1Name;
      document.getElementById('final-p2-name').textContent = gameState.player2Name;
      document.getElementById('current-player-turn').textContent = gameState.player1Name;

      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
      document.getElementById('gameover-screen').classList.add('hidden');

      gameState.player1Score = 0;
      gameState.player2Score = 0;
      gameState.currentPlayer = 1;
      gameState.currentRound = 1;
      gameState.usedWords = { easy: [], medium: [], hard: [] };
      gameState.streak = 0;
      updateStreakDisplay();

      document.getElementById('player1-score').textContent = '0';
      document.getElementById('player2-score').textContent = '0';
      document.getElementById('round-display').textContent = '1/20';
      updateProgressBar();

      document.getElementById('player1-card').classList.add('player-active', 'pulse-glow');
      document.getElementById('player2-card').classList.remove('player-active', 'pulse-glow');

      document.getElementById('difficulty-selection').classList.remove('hidden');
      document.getElementById('game-content').classList.add('hidden');
    }

    function endGame() {
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.remove('hidden');
      document.getElementById('gameover-screen').classList.add('flex');

      document.getElementById('final-p1-score').textContent = gameState.player1Score;
      document.getElementById('final-p2-score').textContent = gameState.player2Score;

      const announcement = document.getElementById('winner-announcement');
      if (gameState.player1Score > gameState.player2Score) {
        announcement.innerHTML = `🎉 ${gameState.player1Name} Wins! 🎉`;
        announcement.className = 'text-2xl font-bold text-blue-600 mb-6';
      } else if (gameState.player2Score > gameState.player1Score) {
        announcement.innerHTML = `🎉 ${gameState.player2Name} Wins! 🎉`;
        announcement.className = 'text-2xl font-bold text-purple-600 mb-6';
      } else {
        announcement.innerHTML = "🤝 It's a Tie! 🤝";
        announcement.className = 'text-2xl font-bold text-amber-600 mb-6';
      }
      speak(announcement.textContent.replace(/🎉|🤝/g, ''));
    }

    function goToStart() {
      document.getElementById('gameover-screen').classList.add('hidden');
      document.getElementById('gameover-screen').classList.remove('flex');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');
    }

    document.getElementById('answer-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); checkAnswer(); }
    });
  </script>
